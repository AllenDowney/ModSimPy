# Book settings
title: Modeling and Simulation in Python
author: Allen B. Downey

latex:
  latex_documents:
    targetname: book.tex

execute:
  execute_notebooks: 'off'

repository:
  url: https://github.com/AllenDowney/ModSimPy
html:
  # Page-view counter: one request per page view to greenteapress.com/gh.gif,
  # counted from the greenteapress.com access logs (GreenTeaPress scripts/log_report.py).
  # No cookies, no third party.
  extra_footer: |
    <script>new Image().src="https://greenteapress.com/gh.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)</script>
  use_repository_button: true

parse:
  # Replaces the deprecated myst_extended_syntax (broken in current Jupyter Book):
  # the same extensions, listed individually, plus linkify for bare URLs.
  # https://myst-parser.readthedocs.io/en/latest/syntax/optional.html
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_image
    - linkify
